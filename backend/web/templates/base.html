<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CAKE — 딥페이크 탐지 보조{% endblock %}</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🍰%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

  <nav class="nav">

  <div class="muted">Slice Team · CAKE v2 · <span id="health-dot" class="dot"></span><span id="health-txt">서버 상태 확인 중</span></div>

<script src="/static/js/app.js"></script>
