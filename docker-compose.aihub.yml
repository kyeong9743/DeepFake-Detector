# AI Hub 데이터셋 오버라이드 — 학습·전처리 시 detector 에 데이터 디스크를 연결한다.
# AI Hub Shell 다운로드 방식으로 인해 WSL(Ubuntu) 또는 Linux 에서 사용.
#
#   cd <repo>/cake
#   docker compose -f docker-compose.yml -f docker-compose.aihub.yml run --rm --no-deps detector \
#        python -m training.build_aihub_manifest --per-class 3000
#
# 필수 설정 (.env 또는 환경변수, 기본값 없음):
#   AIHUB_DATA_DIR = 003.딥페이크/ 가 바로 아래에 있는 호스트 디렉터리   (예: /mnt/<디스크>/<AI Hub 폴더>)
# 없으면 compose 가 즉시 오류를 낸다. Windows PowerShell 에서는 WSL 경로가 보이지 않으므로 이 파일을 쓰지 않는다.
#
# 프레임 캐시(/data/cache)는 Docker 네임드 볼륨 cake_cache 에 둔다.
#   - 호스트(특히 WSL 배포판) 경로를 바인드하면 Docker Desktop 의 배포판 간 공유(9P)를 거쳐 JPEG 1장에 ~65 ms -> 학습이 8~10배 느려짐
#   - 네임드 볼륨은 Docker VM 내부 ext4 -> 네이티브 속도
#   - 최초 1회: docker volume create cake_cache
#   - 호스트에 이미 만든 캐시를 옮길 때: cd <캐시 경로> && tar -cf - . | docker run -i --rm -v cake_cache:/dst alpine tar -C /dst -xf -
services:
  detector:
    volumes:
      - ${AIHUB_DATA_DIR:?AIHUB_DATA_DIR 를 .env 에 설정하십시오 (003.딥페이크 가 있는 디렉터리)}:/aihub:ro
      - cake_cache:/data/cache # 얼굴 크롭 프레임 캐시 (네임드 볼륨)

volumes:
  cake_cache:
    external: true
